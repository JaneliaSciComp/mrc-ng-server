# Public HTTPS entrypoint for the data service.
#
# The browser (running the Fileglancer-hosted Neuroglancer app) fetches
# precomputed chunks from this host cross-origin, so it must be HTTPS — a
# plain-HTTP source on an HTTPS page is blocked as mixed content. TLS is
# terminated here at the edge; the pod serves plain HTTP on :8000.
#
# Whatever host this resolves to is what ai-cryoet's MRCNG_BASE_URL must point
# at: https://<host>/data. Set/override the host in the production overlay.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mrc-ng-server
spec:
  host: mrc-ng-server.int.janelia.org
  to:
    kind: Service
    name: mrc-ng-server
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
