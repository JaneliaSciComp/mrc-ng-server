apiVersion: apps/v1
kind: Deployment
metadata:
  name: mrc-ng-server
spec:
  # Stateless: every request is served from the read-only data tree plus the
  # shared pyramid cache, with no in-process viewer/session state. Safe to scale
  # horizontally — bump this (or attach an HPA) to add throughput. Kept low by
  # default; the bottleneck is NFS/cephfs, not CPU.
  replicas: 2
  selector:
    matchLabels:
      app: mrc-ng-server
  template:
    metadata:
      labels:
        app: mrc-ng-server
    spec:
      # The data + cache volumes live on the building.prfs filer / cephfs; only
      # nodes tagged nfs-dmz=true can reach them, so pin the pods there (same as
      # the ai-cryoet api/scanner pods).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nfs-dmz
                    operator: In
                    values:
                      - "true"
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mrc-ng-server
          image: ghcr.io/janeliascicomp/mrc-ng-server:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: mrcng-config
          volumeMounts:
            # Read-only MRC data. Must equal MRCNG_SOURCE_ROOT in the ConfigMap
            # and the path the scanner recorded on each tomogram's mrc_path, so
            # the API's precomputed:// URLs (relpath under this root) resolve.
            - name: catalog-data
              mountPath: /groups/cryoet/cryoet/data
              readOnly: true
            # Shared pyramid cache: the ai-cryoet scanner writes it, this server
            # only reads it.
            - name: mrc-cache
              mountPath: /cache
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
      terminationGracePeriodSeconds: 10
      volumes:
        # catalog-data-pvc is defined by the ai-cryoet deployment (same
        # namespace); reused read-only here rather than re-declared, so there is
        # one binding to the NFS PV.
        - name: catalog-data
          persistentVolumeClaim:
            claimName: catalog-data-pvc
            readOnly: true
        - name: mrc-cache
          persistentVolumeClaim:
            claimName: mrc-cache-pvc
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: mrc-ng-server
spec:
  selector:
    app: mrc-ng-server
  ports:
    - name: http
      port: 8000
      targetPort: 8000
