[project]
authors = [{name = "Konrad Rokicki", email = "rokickik@janelia.hhmi.org"}]
description = "Serve downsample pyramids of MRC tomograms to Neuroglancer via the precomputed protocol"
dependencies = ["fastapi", "uvicorn", "numpy", "pydantic-settings"]
name = "mrc-ng-server"
requires-python = ">= 3.11"
version = "0.1.0"

[project.scripts]
mrc-pyramid = "mrcng.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/mrcng"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
mrc_ng_server = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = "*"
mrcfile = "*"
httpx = "*"

[tool.pixi.environments]
default = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
build-cache = "mrc-pyramid build"
pyramid-status = "mrc-pyramid status"
pyramid-prune = "mrc-pyramid prune"
serve = "uvicorn mrcng.server.app:get_app --factory --host 0.0.0.0 --port 8000 --ssl-keyfile /opt/certs/cert.key --ssl-certfile /opt/certs/cert.crt"
test = "pytest"
benchmark = "python -m mrcng.benchmark"
